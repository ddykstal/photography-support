# Example Apache vhost for annotate-batch using mod_wsgi
#
# Replace all /ABS/PATH/... placeholders with your real paths.
#
# Debian packages typically needed:
#   sudo apt install apache2 libapache2-mod-wsgi-py3
#   sudo a2enmod wsgi

<VirtualHost *:80>
    ServerName blindingmoon.net

    # Python app process (venv + app path)
    WSGIDaemonProcess annotate-batch \
        python-home=/ABS/PATH/TO/photography-support/.venv \
        python-path=/ABS/PATH/TO/photography-support/annotate-batch
    WSGIProcessGroup annotate-batch

    # WSGI entrypoint
    WSGIScriptAlias / /ABS/PATH/TO/photography-support/annotate-batch/wsgi.py

    # Optional profile override
    # WSGISetEnv ANNOTATE_PROFILE /ABS/PATH/TO/photography-support/annotate-batch/bin/profiles/annotation-v2-125.annotate

    # Static files
    Alias /static /ABS/PATH/TO/photography-support/annotate-batch/static
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/static>
        Require all granted
    </Directory>

    # App code + templates
    <Directory /ABS/PATH/TO/photography-support/annotate-batch>
        <Files wsgi.py>
            Require all granted
        </Files>
        Require all granted
    </Directory>

    # Keep upload/output directories web-inaccessible directly.
    # Files are served through Flask routes (/files and /download).
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/uploads>
        Require all denied
    </Directory>
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/annotated>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/annotate-batch-error.log
    CustomLog ${APACHE_LOG_DIR}/annotate-batch-access.log combined
</VirtualHost>
