# Example HTTPS Apache vhost for annotate-batch using reverse proxy to Gunicorn
#
# Replace all placeholders with real values.
# Set ANNOTATE_PROFILE where Gunicorn is launched (point to annotate-border/profiles).
#
# Debian packages typically needed:
#   sudo apt install apache2 certbot python3-certbot-apache
#   sudo a2enmod proxy proxy_http headers ssl rewrite

# Redirect plain HTTP to HTTPS
<VirtualHost *:80>
    ServerName blindingmoon.net
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName blindingmoon.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/blindingmoon.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/blindingmoon.net/privkey.pem

    # Reasonable TLS defaults (adjust to your policy)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Security headers (minimal sensible baseline)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPreserveHost On
    ProxyRequests Off

    # Let app know original scheme/host.
    RequestHeader set X-Forwarded-Proto "https"

    # Serve static directly from Apache.
    ProxyPass /static/ !
    Alias /static /ABS/PATH/TO/photography-support/annotate-batch/static
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/static>
        Require all granted
    </Directory>

    # Reverse proxy app requests to Gunicorn.
    ProxyPass / http://127.0.0.1:5050/ timeout=600
    ProxyPassReverse / http://127.0.0.1:5050/

    # Keep runtime folders web-inaccessible directly.
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/uploads>
        Require all denied
    </Directory>
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/annotated>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/annotate-batch-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/annotate-batch-ssl-access.log combined
</VirtualHost>
