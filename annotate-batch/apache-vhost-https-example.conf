# Example HTTPS Apache vhost for annotate-batch using mod_wsgi
#
# Replace all /ABS/PATH/... and domain placeholders with real values.
#
# Debian packages typically needed:
#   sudo apt install apache2 libapache2-mod-wsgi-py3
#   sudo a2enmod wsgi ssl headers rewrite
#
# If using Let's Encrypt:
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d blindingmoon.net

# Optional: redirect plain HTTP to HTTPS
<VirtualHost *:80>
    ServerName blindingmoon.net
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName blindingmoon.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/blindingmoon.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/blindingmoon.net/privkey.pem

    # Reasonable TLS defaults (adjust to your policy)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Security headers (minimal sensible baseline)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Python app process (venv + app path)
    WSGIDaemonProcess annotate-batch \
        python-home=/ABS/PATH/TO/photography-support/.venv \
        python-path=/ABS/PATH/TO/photography-support/annotate-batch
    WSGIProcessGroup annotate-batch

    # WSGI entrypoint
    WSGIScriptAlias / /ABS/PATH/TO/photography-support/annotate-batch/wsgi.py

    # Optional profile override
    # WSGISetEnv ANNOTATE_PROFILE /ABS/PATH/TO/photography-support/annotate-batch/bin/profiles/annotation-snapshot.annotate

    # Static files
    Alias /static /ABS/PATH/TO/photography-support/annotate-batch/static
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/static>
        Require all granted
    </Directory>

    # App code + templates
    <Directory /ABS/PATH/TO/photography-support/annotate-batch>
        <Files wsgi.py>
            Require all granted
        </Files>
        Require all granted
    </Directory>

    # Keep upload/output directories web-inaccessible directly.
    # Files are served through Flask routes (/files and /download).
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/uploads>
        Require all denied
    </Directory>
    <Directory /ABS/PATH/TO/photography-support/annotate-batch/annotated>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/annotate-batch-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/annotate-batch-ssl-access.log combined
</VirtualHost>
